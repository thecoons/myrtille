name: demo-service-load-test
ref: ""

# Top-level variables, available in every step's url/body/count templates as
# `.Vars`.
vars:
  user_count: 10
  max_orders_per_user: 3

service:
  base_url: http://localhost:8080
  metrics:
    url: http://localhost:8080/metrics
    interval: 2s

init:
  steps:
    # list_products runs first so create_users' children below can pick
    # from product_ids via `.Dict`.
    - name: list_products
      method: GET
      url: "{{.BaseURL}}/products"
      extract:
        - path: "#.id"
          as: product_ids
    - name: create_users
      method: POST
      url: "{{.BaseURL}}/users"
      body: '{"name":"user-{{.Index}}"}'
      count: "{{.Vars.user_count}}"
      extract:
        - path: id
          as: user_ids
      # children run once per create_users iteration, with that iteration's
      # parsed response exposed as `.Parent` — here, creating a random
      # number of orders for each freshly created user.
      children:
        - name: create_orders_for_user
          method: POST
          url: "{{.BaseURL}}/orders"
          body: '{"userId":"{{.Parent.id}}","productId":"{{pick .Dict.product_ids}}"}'
          count: "{{random 1 .Vars.max_orders_per_user}}"

k6:
  # Alternative to `steps` below: point at a hand-written script for cases
  # needing real k6 logic (custom checks, non-HTTP protocols, etc.) —
  # mutually exclusive with `steps`/`options`.
  # script: ./scenario.js
  steps:
    - name: place_order
      method: POST
      url: "{{.BaseURL}}/orders"
      body: '{"userId":"{{pick "user_ids"}}","productId":"{{pick "product_ids"}}"}'
      checks:
        "status is 201": "r.status === 201"
      sleep: 200ms
  options:
    vus: 5
    duration: 10s
  state_env: STATE_FILE

report:
  output_dir: ./reports
  formats: ["markdown", "json", "html"]
