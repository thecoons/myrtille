name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test
        run: go test -race ./...

  # Compile-only check, not a release target (see release.yml, linux-only):
  # catches accidental use of POSIX-only APIs (as opposed to Windows, which
  # servicelifecycle/k6run already rely on for process-group management via
  # syscall.Setpgid/syscall.Kill — genuinely unsupported, not just untested).
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build for darwin/${{ matrix.goarch }}
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  gofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: go fix (all modules)
        run: |
          go fix ./...
          (cd pkg/promscrape && go fix ./...)
          (cd pkg/oteltrace && go fix ./...)

      - name: Fail if go fix changed anything
        run: git diff --exit-code

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan main module
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          govulncheck ./...

      - name: Scan pkg/promscrape (own go.mod, used by xk6 build)
        working-directory: pkg/promscrape
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          govulncheck ./...

      - name: Scan pkg/oteltrace (own go.mod, used by xk6 build)
        working-directory: pkg/oteltrace
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          govulncheck ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@latest

      - name: Build k6 (custom, with promscrape)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./scripts/build-k6.sh

      - name: Build myrtille
        run: go build -o bin/myrtille ./cmd/myrtille

      - name: Build stub service
        run: go build -o /tmp/stubservice ./examples/demo-service/stubservice

      - name: Run demo suite end-to-end
        run: ./bin/myrtille run --config examples/demo-service/myrtille.yaml

      - name: Verify report output
        run: |
          dir="$(ls -dt examples/demo-service/reports/*/ | head -1)"
          test -s "${dir}report.md"
          test -s "${dir}report.json"
          test -s "${dir}report.html"
          jq -e '
            .k6.Passed == true
            and (.k6.Summary.Checks | length > 0)
            and ([.k6.Summary.Checks[] | .Fails == 0 and .Passes > 0] | all)
          ' "${dir}report.json"
