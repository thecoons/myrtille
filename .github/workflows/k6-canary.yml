name: k6-canary

# Catches an upstream k6 release breaking our xk6 extensions (pkg/xk6ext)
# early, rather than discovering it only when someone goes to bump the
# pinned version in pkg/xk6ext/go.mod. ci.yml's own e2e job already builds
# and smoke-tests the exact pinned version on every push/PR — this job does
# the same build + smoke test, but against whatever is the latest v2
# release right now, in an ephemeral checkout (the go.mod/go.sum bump below
# is never committed).
#
# Scoped to the go.k6.io/k6/v2 *line* only: go get @latest only considers
# v2.x.y releases, so a hypothetical v3 (a deliberate migration, not
# something a canary should surface) is out of scope by construction.
on:
  schedule:
    # Monday 06:00 UTC. Runs against main only (schedule always targets the
    # default branch) — there's no PR/commit to attribute a break to, this
    # is purely "does building against upstream latest still work today".
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Bump pkg/xk6ext to the latest published k6 v2 release
        working-directory: pkg/xk6ext
        run: |
          go get go.k6.io/k6/v2@latest
          go mod tidy
          echo "k6 version under test:"
          go list -m go.k6.io/k6/v2

      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@latest

      - name: Build k6 (custom, against latest k6)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./scripts/build-k6.sh

      - name: Build myrtille
        run: go build -o bin/myrtille ./cmd/myrtille

      - name: Build stub service
        run: go build -o /tmp/stubservice ./examples/demo-service/stubservice

      - name: Run demo suite end-to-end
        run: ./bin/myrtille run --config examples/demo-service/myrtille.yaml

      - name: Verify report output
        run: |
          dir="$(ls -dt examples/demo-service/reports/*/ | head -1)"
          test -s "${dir}report.md"
          test -s "${dir}report.json"
          test -s "${dir}report.html"
          jq -e '
            .k6.Passed == true
            and (.k6.Summary.Checks | length > 0)
            and ([.k6.Summary.Checks[] | select(.Name != "checkout succeeded") | .Fails == 0 and .Passes > 0] | all)
            and (any(.k6.Summary.Checks[]; .Name == "checkout succeeded" and .Passes > 0 and .Fails > 0))
            and (.k6.FailedTraces | length > 0)
          ' "${dir}report.json"
