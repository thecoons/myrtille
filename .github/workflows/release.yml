name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/myrtille ./cmd/myrtille

      - name: Package
        run: |
          pkg="myrtille-${GITHUB_REF_NAME}-linux-${{ matrix.goarch }}"
          mkdir -p "$pkg"
          cp dist/myrtille "$pkg/"
          cp README.md "$pkg/"
          tar -czf "${pkg}.tar.gz" "$pkg"
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: myrtille-linux-${{ matrix.goarch }}
          path: |
            myrtille-*.tar.gz
            myrtille-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
