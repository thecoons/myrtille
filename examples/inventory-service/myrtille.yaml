name: inventory-service-load-test
ref: ""

service:
  base_url: http://localhost:8080
  metrics:
    url: http://localhost:8080/metrics
    interval: 1s

init:
  steps:
    - name: list_products
      method: GET
      url: "{{.BaseURL}}/products"
      extract:
        - path: "#.id"
          as: product_ids

k6:
  script: ./scenario.js
  # No --vus/--duration: k6 CLI flags override script options, so the
  # ramping stages defined in scenario.js are left to drive the run.
  state_env: STATE_FILE

report:
  output_dir: ./reports
  formats: ["markdown", "json", "html"]
